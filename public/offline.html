<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sin conexión · Cuaderno Social de la Familia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F5EBDD;
        color: #1F1813;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 400px;
        width: 100%;
        background: #FFFDF8;
        border: 3px dashed #BA9254;
        border-radius: 28px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 48px rgba(22, 77, 50, 0.16);
      }
      .badge {
        display: inline-block;
        background: #164D32;
        color: #F2C443;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 10px;
        font-family: Georgia, serif;
        color: #164D32;
        font-size: 26px;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.55;
        color: #493B32;
      }
      .card.has-copy { max-width: 640px; text-align: left; }
      #reading { margin: 20px 0; display: grid; gap: 10px; }
      #reading article { border: 1px solid #e5d2b4; border-radius: 14px; padding: 12px 14px; }
      #reading p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      #reading time { color: #62492e; font-size: 12px; margin-left: 8px; }
      #saved-at { margin: 0; }
      button {
        background: linear-gradient(135deg, #164D32, #398B4B);
        color: #FFFDF8;
        border: 2px dashed rgba(242, 196, 67, 0.7);
        border-radius: 999px;
        padding: 12px 26px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="badge">Cuaderno Social de la Familia</div>
      <h1 id="heading">Sin conexión</h1>
      <p id="explanation">Conéctate a Internet para volver a abrir el cuaderno.</p>
      <p id="saved-at" hidden></p>
      <section id="reading" aria-label="Publicaciones guardadas"></section>
      <button type="button" id="retry">Reintentar conexión</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => window.top.location.reload());
      try {
        const id = localStorage.getItem('cuaderno_los_nazco_active_user_v2');
        const copy = JSON.parse(localStorage.getItem('cuaderno_family_offline_reading_v1') || 'null');
        if (id && copy && copy.memberId === id && Array.isArray(copy.posts)) {
          const date = new Intl.DateTimeFormat('es', { dateStyle: 'short', timeStyle: 'short' });
          document.getElementById('card').classList.add('has-copy');
          document.getElementById('heading').textContent = 'Muro guardado sin conexión';
          document.getElementById('explanation').textContent = copy.posts.length
            ? 'Puedes leer las publicaciones guardadas. Los mensajes, las fotos y las llamadas requieren conexión.'
            : 'Aún no hay publicaciones de texto guardadas.';
          const savedAt = document.getElementById('saved-at');
          if (Number.isFinite(Date.parse(copy.savedAt))) {
            savedAt.textContent = 'Última copia: ' + date.format(new Date(copy.savedAt));
            savedAt.hidden = false;
          }
          const reading = document.getElementById('reading');
          for (const post of copy.posts.slice(0, 24)) {
            const article = document.createElement('article');
            const author = document.createElement('strong');
            author.textContent = post.author;
            article.append(author);
            if (Number.isFinite(Date.parse(post.createdAt))) {
              const time = document.createElement('time');
              time.dateTime = post.createdAt;
              time.textContent = date.format(new Date(post.createdAt));
              article.append(time);
            }
            const text = document.createElement('p');
            text.textContent = post.text;
            article.append(text);
            reading.append(article);
          }
        }
      } catch {
        // The generic reconnect view remains available if the copy cannot be read.
      }
    </script>
  </body>
</html>
